name: China Trade Monitor

on:
  schedule:
    - cron: "12 12 * * *"   # täglich 12:12 UTC
    - cron: "12 12 25 5 *"  # 25. Mai 12:12 UTC — Report
  workflow_dispatch:         # manuell auslösbar

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencies
        run: pip install requests

      - name: Monitor — täglicher Ping
        run: python monitor.py
        env:
          RUN_DATE: ${{ github.event.schedule }}

      - name: Commit state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/releases.json
          git diff --cached --quiet || git commit -m "chore: state update $(date -u +%Y-%m-%dT%H:%M)Z"
          git push

      - name: Report — nur am 25. Mai
        if: github.event.schedule == '12 12 25 5 *'
        run: python report.py
        env:
          EMAIL_TO:           ${{ secrets.EMAIL_TO }}
          EMAIL_FROM:         ${{ secrets.EMAIL_FROM }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
